<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Citas · Ankaa</title>
  <link rel="icon" type="image/png" href="../Imagen inicial.jpg">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>


    :root {
      --color-blanco: #FEFDFB;
      --color-beige: #F1E8D8;
      --color-beige-suave: #F8F2E7;
      --color-azul-claro: #DFEAEE;
      --color-dorado: #B9975B;
      --color-dorado-suave: #E7D9BC;
      --color-cafe: #4A3B2F;
      --color-cafe-suave: #8A7360;
      --color-borde: #E7DDC9;
      --color-sombra: rgba(74, 59, 47, 0.08);

      --fuente-display: "Fraunces", serif;
      --fuente-texto: "Plus Jakarta Sans", sans-serif;

      --radio-xl: 24px;
      --radio-lg: 18px;
      --radio-md: 12px;
      --radio-pastilla: 999px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    [hidden] {
    display: none !important;
}

    body {
      font-family: var(--fuente-texto);
      background: var(--color-beige-suave);
      color: var(--color-cafe);
      min-height: 100vh;
      padding: clamp(20px, 4vw, 40px) clamp(16px, 4vw, 32px);
    }

    .admin-layout { max-width: 1120px; margin: 0 auto; }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--color-borde);
    }

    .admin-header__marca {
      font-size: 13px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--color-dorado);
      font-weight: 600;
    }

    .admin-header__titulo {
      font-family: var(--fuente-display);
      font-size: clamp(26px, 4vw, 34px);
    }

    .perfil-katherin {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--color-blanco);
      padding: 8px 18px 8px 10px;
      border-radius: var(--radio-pastilla);
      border: 1px solid var(--color-borde);
    }

    .perfil-katherin__avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--color-dorado-suave);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700;
    }

    .metricas {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .metrica-card {
      background: var(--color-blanco);
      padding: 18px 22px;
      border-radius: var(--radio-lg);
      border: 1px solid var(--color-borde);
    }

    .metrica-card__num {
      font-family: var(--fuente-display);
      font-size: 32px;
      font-weight: 600;
      color: var(--color-dorado);
    }

    .metrica-card__label {
      font-size: 13px;
      color: var(--color-cafe-suave);
    }

    .barra-filtros {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 24px;
    }

    .filtros-grupo { display: flex; gap: 8px; flex-wrap: wrap; }

    .btn-filtro {
      border: 1px solid var(--color-borde);
      background: var(--color-blanco);
      padding: 8px 16px;
      border-radius: var(--radio-pastilla);
      font-size: 13px;
      font-weight: 600;
      color: var(--color-cafe-suave);
      cursor: pointer;
    }

    .btn-filtro.activo {
      background: var(--color-cafe);
      color: var(--color-blanco);
      border-color: var(--color-cafe);
    }

    .citas-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 22px;
    }

    .cita-card {
      background: var(--color-blanco);
      border-radius: var(--radio-xl);
      padding: 24px;
      border: 1px solid var(--color-borde);
      box-shadow: 0 8px 24px var(--color-sombra);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .cita-card__cabecera {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--color-beige-suave);
    }

    .badge-estado {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: var(--radio-pastilla);
    }

    .badge-estado--confirmada { background: var(--color-azul-claro); color: #2F5968; }
    .badge-estado--atendida { background: #E4ECE3; color: #456D48; }
    .badge-estado--pendiente { background: #FDE8D7; color: #B35C1E; }

    .cita-paciente {
      font-family: var(--fuente-display);
      font-size: 21px;
      margin-bottom: 10px;
    }

    .cita-detalles {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13.5px;
      color: var(--color-cafe-suave);
      margin-bottom: 14px;
    }

    .cita-motivo {
      background: var(--color-beige-suave);
      padding: 10px 12px;
      border-radius: var(--radio-md);
      font-size: 13px;
      margin-bottom: 16px;
      border-left: 3px solid var(--color-dorado);
    }

    .caja-comprobante {
      margin-bottom: 16px;
      padding: 10px;
      background: #FAF8F5;
      border-radius: var(--radio-md);
      border: 1px dashed var(--color-borde);
      text-align: center;
    }

    .btn-ver-comprobante {
      background: var(--color-dorado);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: var(--radio-pastilla);
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
      margin-top: 6px;
    }

    .cita-acciones { display: flex; flex-direction: column; gap: 8px; }

    .btn-accion {
      padding: 10px;
      border-radius: var(--radio-md);
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }

    .btn-accion--wsp { background: #25D366; color: white; }
    .btn-accion--aceptar { background: #2E7D32; color: white; }
    .btn-accion--atendida { background: var(--color-cafe); color: white; }

    /* Modal Visor */
    .modal-visor {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-contenido {
      background: white;
      padding: 20px;
      border-radius: var(--radio-lg);
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    .modal-contenido img {
      max-width: 100%;
      max-height: 70vh;
      border-radius: var(--radio-md);
      margin-bottom: 12px;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <div class="admin-layout">
    <header class="admin-header">
      <div>
        <p class="admin-header__marca">Ankaa · Terapeuta del Renacer</p>
        <h1 class="admin-header__titulo">Gestión de Reservas</h1>
      </div>

      <div class="perfil-katherin">
        <div class="perfil-katherin__avatar">K</div>
        <div>
          <p style="font-size: 13.5px; font-weight: 600;">Katherine</p>
          <span style="font-size: 11px; color: var(--color-cafe-suave);">Administradora</span>
        </div>
      </div>
    </header>

    <section class="metricas">
      <div class="metrica-card">
        <div class="metrica-card__num" id="total-citas">0</div>
        <div class="metrica-card__label">Total reservas</div>
      </div>
      <div class="metrica-card">
        <div class="metrica-card__num" id="total-pendientes">0</div>
        <div class="metrica-card__label">Por revisar comprobante</div>
      </div>
      <div class="metrica-card">
        <div class="metrica-card__num" id="total-confirmadas">0</div>
        <div class="metrica-card__label">Citas confirmadas</div>
      </div>
      <div class="metrica-card">
        <div class="metrica-card__num" id="total-mes">0</div>
        <div class="metrica-card__label">Atendidas (último mes)</div>
      </div>
    </section>

    <div class="barra-filtros">
      <div class="filtros-grupo">
        <button class="btn-filtro activo" data-filtro="todas" onclick="filtrarCitas('todas', this)">Todas</button>
        <button class="btn-filtro" data-filtro="Pendiente de comprobante" onclick="filtrarCitas('Pendiente de comprobante', this)">Por Revisar</button>
        <button class="btn-filtro" data-filtro="Confirmada" onclick="filtrarCitas('Confirmada', this)">Confirmadas</button>
        <button class="btn-filtro" data-filtro="ultimo-mes" onclick="filtrarCitas('ultimo-mes', this)">Historial (Último mes)</button>
      </div>

      <button class="btn-filtro" onclick="cargarCitas()">Actualizar lista</button>
    </div>

    <main class="citas-grid" id="contenedor-citas"></main>
  </div>

  <!-- Modal para ver comprobante -->
  <div id="modal-visor" class="modal-visor" hidden>
    <div class="modal-contenido">
      <h3 style="margin-bottom: 12px; font-family: var(--fuente-display);">Comprobante Nequi</h3>
      <img id="modal-img" src="" alt="Comprobante">
      <button class="btn-accion btn-accion--atendida" style="width: 100%;" onclick="cerrarVisor()">Cerrar</button>
    </div>
  </div>

<script>
  /* =========================================================================
     ANKAA · Panel de Administración — Conexión Directa con Supabase
     ========================================================================= */

  const SUPABASE_URL = "https://dtjmfiydqjdvukojfgsw.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR0am1maXlkcWpkdnVrb2pmZ3N3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MjI4NTcsImV4cCI6MjEwNDk5ODg1N30.E-yitBKj2Y3uXyKutGIv-GEmgBq0_fkgF5OCZ9XcvtE";
  const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

  let listadoCitas = [];
  let filtroActual = "Todas";

  const el = {
    totalReservas: document.getElementById("total-reservas"),
    porRevisar: document.getElementById("por-revisar"),
    citasConfirmadas: document.getElementById("citas-confirmadas"),
    atendidasMes: document.getElementById("atendidas-mes"),
    contenedorCitas: document.getElementById("contenedor-citas"),
    btnActualizar: document.getElementById("btn-actualizar"),
    pestanas: document.querySelectorAll(".filtro-btn")
  };

  async function cargarCitas() {
    try {
      if (!supabase) throw new Error("Cliente de Supabase no inicializado");

      const { data, error } = await supabase
        .from("citas")
        .select("*")
        .order("id", { ascending: false });

      if (error) throw error;

      listadoCitas = data.map(c => ({
        id: c.id,
        nombrePaciente: c.nombre,
        telefono: c.telefono,
        correo: c.correo,
        motivo: c.motivo,
        metodoPago: c.metodo_pago,
        comprobante: c.comprobante,
        estado: c.estado,
        fechaAtendida: c.fecha_atendida,
        horario: {
          fecha: c.fecha,
          horaInicio: c.hora
        }
      }));
    } catch (err) {
      console.error("Error al cargar citas desde Supabase:", err);
      listadoCitas = [];
    }

    actualizarMetricas();
    renderizarCitas();
  }

  function actualizarMetricas() {
    const total = listadoCitas.length;
    const pendientes = listadoCitas.filter(c => c.estado === "Pendiente de comprobante").length;
    const confirmadas = listadoCitas.filter(c => c.estado === "Confirmada").length;
    const atendidas = listadoCitas.filter(c => c.estado === "Atendida").length;

    if (el.totalReservas) el.totalReservas.textContent = total;
    if (el.porRevisar) el.porRevisar.textContent = pendientes;
    if (el.citasConfirmadas) el.citasConfirmadas.textContent = confirmadas;
    if (el.atendidasMes) el.atendidasMes.textContent = atendidas;
  }

  function renderizarCitas() {
    if (!el.contenedorCitas) return;
    el.contenedorCitas.innerHTML = "";

    const citasFiltradas = listadoCitas.filter(c => {
      if (filtroActual === "Todas") return true;
      if (filtroActual === "Por Revisar") return c.estado === "Pendiente de comprobante";
      if (filtroActual === "Confirmadas") return c.estado === "Confirmada";
      if (filtroActual === "Historial (Último mes)") return c.estado === "Atendida";
      return true;
    });

    if (citasFiltradas.length === 0) {
      el.contenedorCitas.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: var(--color-cafe-suave); padding: 40px 0;'>No hay reservas registradas en esta sección.</p>";
      return;
    }

    citasFiltradas.forEach(cita => {
      const tarjeta = document.createElement("div");
      tarjeta.className = "tarjeta-cita";

      const btnComprobanteHtml = cita.comprobante
        ? `<div style="margin: 12px 0; border: 1px dashed var(--color-borde); padding: 8px; border-radius: 8px; text-align: center;">
             <p style="font-size: 11px; margin: 0 0 6px 0; color: var(--color-cafe-suave);">Comprobante adjunto</p>
             <button type="button" class="btn-comprobante" onclick="abrirModalComprobante('${cita.id}')" style="background: var(--color-dorado); color: white; border: none; padding: 4px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;">Ver Comprobante</button>
           </div>`
        : "";

      let botonesAccionHtml = "";
      if (cita.estado === "Pendiente de comprobante") {
        botonesAccionHtml = `
          <button type="button" onclick="cambiarEstado(${cita.id}, 'Confirmada')" style="background: var(--color-dorado); color: white; border: none; padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 8px; width: 100%;">Confirmar Pago</button>
        `;
      } else if (cita.estado === "Confirmada") {
        botonesAccionHtml = `
          <button type="button" onclick="cambiarEstado(${cita.id}, 'Atendida')" style="background: #2E7D32; color: white; border: none; padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 8px; width: 100%;">Marcar como Atendida</button>
        `;
      }

      tarjeta.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;">
          <div>
            <span style="font-size: 12px; font-weight: 600; color: var(--color-dorado);">${cita.horario.fecha}</span>
            <div style="font-size: 18px; font-weight: 700; color: var(--color-cafe);">${cita.horario.horaInicio}</div>
          </div>
          <span style="font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 12px; background: rgba(185, 151, 91, 0.15); color: var(--color-dorado); text-transform: uppercase;">${cita.estado}</span>
        </div>
        <h3 style="margin: 8px 0 4px 0; font-size: 16px; color: var(--color-cafe);">${cita.nombrePaciente}</h3>
        <p style="margin: 2px 0; font-size: 13px; color: var(--color-cafe-suave);">📞 Tel: ${cita.telefono}</p>
        <p style="margin: 2px 0; font-size: 13px; color: var(--color-cafe-suave);">💳 Pago: ${cita.metodoPago}</p>
        ${btnComprobanteHtml}
        <div style="background: var(--color-beige-suave); padding: 8px 12px; border-radius: 8px; margin: 10px 0; font-size: 12.5px; color: var(--color-cafe);">
          <strong>Motivo:</strong> ${cita.motivo || "No especificado"}
        </div>
        <a href="https://wa.me/57${cita.telefono.replace(/\\D/g, '')}" target="_blank" rel="noopener noreferrer" style="display: block; text-align: center; background: #25D366; color: white; text-decoration: none; padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; margin-top: 8px;">WhatsApp</a>
        ${botonesAccionHtml}
      `;

      el.contenedorCitas.appendChild(tarjeta);
    });
  }

  async function cambiarEstado(id, nuevoEstado) {
    try {
      const datosActualizar = { estado: nuevoEstado };
      if (nuevoEstado === "Atendida") {
        datosActualizar.fecha_atendida = new Date().toISOString().split("T")[0];
      }

      const { error } = await supabase
        .from("citas")
        .update(datosActualizar)
        .eq("id", id);

      if (error) throw error;
      await cargarCitas();
    } catch (e) {
      console.error("Error al actualizar estado:", e);
      alert("No se pudo actualizar el estado de la reserva.");
    }
  }

  function abrirModalComprobante(id) {
    const cita = listadoCitas.find(c => String(c.id) === String(id));
    if (!cita || !cita.comprobante) return;
    const ventana = window.open("");
    ventana.document.write(`<img src="${cita.comprobante}" style="max-width:100%; height:auto;" alt="Comprobante">`);
  }

  if (el.btnActualizar) {
    el.btnActualizar.addEventListener("click", cargarCitas);
  }

  el.pestanas.forEach(btn => {
    btn.addEventListener("click", () => {
      el.pestanas.forEach(b => b.classList.remove("activa"));
      btn.classList.add("activa");
      filtroActual = btn.textContent.trim();
      renderizarCitas();
    });
  });

  cargarCitas();
</script>
</html>
