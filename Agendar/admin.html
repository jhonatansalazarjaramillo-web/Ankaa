<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Citas · Ankaa</title>
  <link rel="icon" type="image/png" href="../Imagen inicial.jpg">
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>

    
    :root {
      --color-blanco: #FEFDFB;
      --color-beige: #F1E8D8;
      --color-beige-suave: #F8F2E7;
      --color-azul-claro: #DFEAEE;
      --color-dorado: #B9975B;
      --color-dorado-suave: #E7D9BC;
      --color-cafe: #4A3B2F;
      --color-cafe-suave: #8A7360;
      --color-borde: #E7DDC9;
      --color-sombra: rgba(74, 59, 47, 0.08);

      --fuente-display: "Fraunces", serif;
      --fuente-texto: "Plus Jakarta Sans", sans-serif;

      --radio-xl: 24px;
      --radio-lg: 18px;
      --radio-md: 12px;
      --radio-pastilla: 999px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    [hidden] {
    display: none !important;
}

    body {
      font-family: var(--fuente-texto);
      background: var(--color-beige-suave);
      color: var(--color-cafe);
      min-height: 100vh;
      padding: clamp(20px, 4vw, 40px) clamp(16px, 4vw, 32px);
    }

    .admin-layout { max-width: 1120px; margin: 0 auto; }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--color-borde);
    }

    .admin-header__marca {
      font-size: 13px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--color-dorado);
      font-weight: 600;
    }

    .admin-header__titulo {
      font-family: var(--fuente-display);
      font-size: clamp(26px, 4vw, 34px);
    }

    .perfil-katherin {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--color-blanco);
      padding: 8px 18px 8px 10px;
      border-radius: var(--radio-pastilla);
      border: 1px solid var(--color-borde);
    }

    .perfil-katherin__avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--color-dorado-suave);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700;
    }

    .metricas {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .metrica-card {
      background: var(--color-blanco);
      padding: 18px 22px;
      border-radius: var(--radio-lg);
      border: 1px solid var(--color-borde);
    }

    .metrica-card__num {
      font-family: var(--fuente-display);
      font-size: 32px;
      font-weight: 600;
      color: var(--color-dorado);
    }

    .metrica-card__label {
      font-size: 13px;
      color: var(--color-cafe-suave);
    }

    .barra-filtros {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 24px;
    }

    .filtros-grupo { display: flex; gap: 8px; flex-wrap: wrap; }

    .btn-filtro {
      border: 1px solid var(--color-borde);
      background: var(--color-blanco);
      padding: 8px 16px;
      border-radius: var(--radio-pastilla);
      font-size: 13px;
      font-weight: 600;
      color: var(--color-cafe-suave);
      cursor: pointer;
    }

    .btn-filtro.activo {
      background: var(--color-cafe);
      color: var(--color-blanco);
      border-color: var(--color-cafe);
    }

    .citas-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 22px;
    }

    .cita-card {
      background: var(--color-blanco);
      border-radius: var(--radio-xl);
      padding: 24px;
      border: 1px solid var(--color-borde);
      box-shadow: 0 8px 24px var(--color-sombra);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .cita-card__cabecera {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--color-beige-suave);
    }

    .badge-estado {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: var(--radio-pastilla);
    }

    .badge-estado--confirmada { background: var(--color-azul-claro); color: #2F5968; }
    .badge-estado--atendida { background: #E4ECE3; color: #456D48; }
    .badge-estado--pendiente { background: #FDE8D7; color: #B35C1E; }

    .cita-paciente {
      font-family: var(--fuente-display);
      font-size: 21px;
      margin-bottom: 10px;
    }

    .cita-detalles {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13.5px;
      color: var(--color-cafe-suave);
      margin-bottom: 14px;
    }

    .cita-motivo {
      background: var(--color-beige-suave);
      padding: 10px 12px;
      border-radius: var(--radio-md);
      font-size: 13px;
      margin-bottom: 16px;
      border-left: 3px solid var(--color-dorado);
    }

    .caja-comprobante {
      margin-bottom: 16px;
      padding: 10px;
      background: #FAF8F5;
      border-radius: var(--radio-md);
      border: 1px dashed var(--color-borde);
      text-align: center;
    }

    .btn-ver-comprobante {
      background: var(--color-dorado);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: var(--radio-pastilla);
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
      margin-top: 6px;
    }

    .cita-acciones { display: flex; flex-direction: column; gap: 8px; }

    .btn-accion {
      padding: 10px;
      border-radius: var(--radio-md);
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }

    .btn-accion--wsp { background: #25D366; color: white; }
    .btn-accion--aceptar { background: #2E7D32; color: white; }
    .btn-accion--atendida { background: var(--color-cafe); color: white; }

    /* Modal Visor */
    .modal-visor {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-contenido {
      background: white;
      padding: 20px;
      border-radius: var(--radio-lg);
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    .modal-contenido img {
      max-width: 100%;
      max-height: 70vh;
      border-radius: var(--radio-md);
      margin-bottom: 12px;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <div class="admin-layout">
    <header class="admin-header">
      <div>
        <p class="admin-header__marca">Ankaa · Terapeuta del Renacer</p>
        <h1 class="admin-header__titulo">Gestión de Reservas</h1>
      </div>

      <div class="perfil-katherin">
        <div class="perfil-katherin__avatar">K</div>
        <div>
          <p style="font-size: 13.5px; font-weight: 600;">Katherine</p>
          <span style="font-size: 11px; color: var(--color-cafe-suave);">Administradora</span>
        </div>
      </div>
    </header>

    <section class="metricas">
      <div class="metrica-card">
        <div class="metrica-card__num" id="total-citas">0</div>
        <div class="metrica-card__label">Total reservas</div>
      </div>
      <div class="metrica-card">
        <div class="metrica-card__num" id="total-pendientes">0</div>
        <div class="metrica-card__label">Por revisar comprobante</div>
      </div>
      <div class="metrica-card">
        <div class="metrica-card__num" id="total-confirmadas">0</div>
        <div class="metrica-card__label">Citas confirmadas</div>
      </div>
      <div class="metrica-card">
        <div class="metrica-card__num" id="total-mes">0</div>
        <div class="metrica-card__label">Atendidas (último mes)</div>
      </div>
    </section>

    <div class="barra-filtros">
      <div class="filtros-grupo">
        <button class="btn-filtro activo" data-filtro="todas" onclick="filtrarCitas('todas', this)">Todas</button>
        <button class="btn-filtro" data-filtro="Pendiente de comprobante" onclick="filtrarCitas('Pendiente de comprobante', this)">Por Revisar</button>
        <button class="btn-filtro" data-filtro="Confirmada" onclick="filtrarCitas('Confirmada', this)">Confirmadas</button>
        <button class="btn-filtro" data-filtro="ultimo-mes" onclick="filtrarCitas('ultimo-mes', this)">Historial (Último mes)</button>
      </div>

      <button class="btn-filtro" onclick="cargarCitas()">Actualizar lista</button>
    </div>

    <main class="citas-grid" id="contenedor-citas"></main>
  </div>

  <!-- Modal para ver comprobante -->
  <div id="modal-visor" class="modal-visor" hidden>
    <div class="modal-contenido">
      <h3 style="margin-bottom: 12px; font-family: var(--fuente-display);">Comprobante Nequi</h3>
      <img id="modal-img" src="" alt="Comprobante">
      <button class="btn-accion btn-accion--atendida" style="width: 100%;" onclick="cerrarVisor()">Cerrar</button>
    </div>
  </div>

  <script>
    let listadoCitas = [];
    let filtroActual = 'todas';

    function esDelUltimoMes(fechaString) {
      if (!fechaString) return false;
      const fecha = new Date(fechaString + 'T00:00:00');
      const hoy = new Date();
      const hace30Dias = new Date();
      hace30Dias.setDate(hoy.getDate() - 30);
      return fecha >= hace30Dias && fecha <= hoy;
    }

    async function cargarCitas() {
      try {
        const res = await fetch('/api/citas');
        listadoCitas = await res.json();
      } catch (err) {
        listadoCitas = JSON.parse(localStorage.getItem('ankaa_citas') || '[]');
      }
      actualizarMetricas();
      renderizarCitas();
    }

    function actualizarMetricas() {
      document.getElementById('total-citas').textContent = listadoCitas.length;
      document.getElementById('total-pendientes').textContent = 
        listadoCitas.filter(c => c.estado === 'Pendiente de comprobante').length;
      document.getElementById('total-confirmadas').textContent = 
        listadoCitas.filter(c => c.estado === 'Confirmada').length;
      document.getElementById('total-mes').textContent = 
        listadoCitas.filter(c => c.estado === 'Atendida' && (esDelUltimoMes(c.fechaAtendida) || esDelUltimoMes(c.horario?.fecha))).length;
    }

    function filtrarCitas(estado, boton) {
      filtroActual = estado;
      document.querySelectorAll('.btn-filtro').forEach(btn => btn.classList.remove('activo'));
      boton.classList.add('activo');
      renderizarCitas();
    }

    function renderizarCitas() {
      const contenedor = document.getElementById('contenedor-citas');
      let filtradas = [];

      if (filtroActual === 'todas') {
        filtradas = listadoCitas;
      } else if (filtroActual === 'ultimo-mes') {
        filtradas = listadoCitas.filter(c => c.estado === 'Atendida' && (esDelUltimoMes(c.fechaAtendida) || esDelUltimoMes(c.horario?.fecha)));
      } else {
        filtradas = listadoCitas.filter(c => c.estado === filtroActual);
      }

      if (!filtradas.length) {
        contenedor.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; background: white; border-radius: 20px;">No hay citas en esta sección.</div>`;
        return;
      }

      contenedor.innerHTML = filtradas.map(cita => {
        const fecha = cita.horario?.fecha || 'Sin fecha';
        const hora = cita.horario?.horaInicio || '';
        const telLimpio = (cita.telefono || '').replace(/\D/g, '');
        const esPendiente = cita.estado === 'Pendiente de comprobante';
        const esConfirmada = cita.estado === 'Confirmada';

        return `
          <article class="cita-card">
            <div>
              <div class="cita-card__cabecera">
                <div>
                  <span style="font-size: 13px; font-weight: 700; color: var(--color-dorado);">${fecha}</span>
                  <p style="font-weight: 700;">${hora}</p>
                </div>
                <span class="badge-estado badge-estado--${esPendiente ? 'pendiente' : cita.estado.toLowerCase()}">
                  ${cita.estado}
                </span>
              </div>

              <h2 class="cita-paciente">${cita.nombrePaciente}</h2>

              <ul class="cita-detalles">
                <li>📞 <strong>Tel:</strong> ${cita.telefono}</li>
                <li>💳 <strong>Pago:</strong> ${cita.metodoPago || 'Efectivo'}</li>
              </ul>

              ${cita.comprobante ? `
                <div class="caja-comprobante">
                  <span style="font-size: 12px; color: var(--color-cafe-suave);">Comprobante adjunto</span><br>
                  <button class="btn-ver-comprobante" onclick="abrirVisor('${cita.comprobante}')">Ver Comprobante</button>
                </div>
              ` : ''}

              <div class="cita-motivo">
                <strong>Motivo:</strong> ${cita.motivo || 'No indicado'}
              </div>
            </div>

            <div class="cita-acciones">
              ${esPendiente ? `
                <button class="btn-accion btn-accion--aceptar" onclick="cambiarEstado('${cita.id}', 'Confirmada')">
                  ✓ Aceptar Comprobante
                </button>
              ` : ''}

              ${esConfirmada ? `
                <button class="btn-accion btn-accion--atendida" onclick="cambiarEstado('${cita.id}', 'Atendida')">
                  Marcar Atendida
                </button>
              ` : ''}

              <a href="https://wa.me/57${telLimpio}?text=Hola%20${encodeURIComponent(cita.nombrePaciente)},%20te%20escribo%20de%20Ankaa." 
                 target="_blank" class="btn-accion btn-accion--wsp">
                WhatsApp
              </a>
            </div>
          </article>
        `;
      }).reverse().join('');
    }

    async function cambiarEstado(id, nuevoEstado) {
      try {
        await fetch(`/api/citas/${id}/estado`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ estado: nuevoEstado })
        });
      } catch (e) {
        const cita = listadoCitas.find(c => c.id === id);
        if (cita) cita.estado = nuevoEstado;
        localStorage.setItem('ankaa_citas', JSON.stringify(listadoCitas));
      }
      cargarCitas();
    }

    function abrirVisor(base64) {
      document.getElementById('modal-img').src = base64;
      document.getElementById('modal-visor').hidden = false;
    }

    function cerrarVisor() {
      document.getElementById('modal-visor').hidden = true;
    }

    document.addEventListener('DOMContentLoaded', cargarCitas);
  </script>
</body>
</html>
